<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción - Control de Asistencias</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1; 
            background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQb2vUYikyevx8z8Bkg1x5XW-PrUv-9DzfTIPugqois49rI9fhCR-GOpVWl&s=10'); 
            background-position: center;
            background-repeat: no-repeat;
            background-size: 75% auto; 
            opacity: 0.05; 
            pointer-events: none;
        }
    </style>
</head>
<body class="text-slate-800 font-sans min-h-screen flex flex-col items-center justify-center antialiased pb-10" style="background-color: #fafbfd;">

    <div id="notification-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3.5"></div>

    <div class="w-full max-w-md py-6 px-4 rounded-b-2xl shadow-lg border-b-4 border-pink-600 text-center relative overflow-hidden mb-6 text-white"
         style="background-image: linear-gradient(rgba(26, 54, 93, 0.85), rgba(26, 54, 93, 0.85)), url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSSPFDgrwRHjbVD_Nl2JOmBWqz6hX457GV0IMJ6j2isnXOXOOO2EMhH0W0&s=10'); background-size: 100% 100%; background-repeat: no-repeat; background-position: center;">
        <h1 class="m-0 text-2xl font-extrabold uppercase tracking-wider">Control de Asistencias</h1>
        <p class="m-0 mt-1 text-slate-200 text-xs">Portal de Inscripción de Alumnos</p>
    </div>

    <!-- VISTA INSCRIPCIÓN ALUMNO -->
    <div id="vista-alumno" class="w-[95%] max-w-md bg-white rounded-2xl p-6 shadow-md border border-slate-100 flex flex-col text-center">
        <h2 class="text-2xl font-bold text-slate-800 mb-2">Inscripción a Escuela</h2>
        <p class="text-xs text-slate-400 mb-6">Ingresá tus datos para registrarte y generar tu credencial.</p>
        
        <form id="form-alumno" class="space-y-4 text-left" onsubmit="return false;">
            <div class="flex flex-col">
                <label class="text-xs font-semibold text-slate-500 mb-1">Seleccionar Escuela:</label>
                <select id="al-escuela" class="p-3 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:border-pink-500 focus:outline-none">
                    <option value="ABC">Escuela ABC</option>
                    <option value="Nivel 1">Nivel 1</option>
                    <option value="Nivel 2">Nivel 2</option>
                    <option value="Nivel 3">Nivel 3</option>
                </select>
            </div>
            
            <div class="flex flex-col">
                <label class="text-xs font-semibold text-slate-500 mb-1">Nombre y Apellido:</label>
                <input type="text" id="al-nombre" required placeholder="Ej: Juan Pérez" class="p-3 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:border-pink-500 focus:outline-none">
            </div>

            <div class="flex flex-col">
                <label class="text-xs font-semibold text-slate-500 mb-1">Edad (Años):</label>
                <input type="number" id="al-edad" required min="1" max="120" placeholder="Ej: 25" class="p-3 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:border-pink-500 focus:outline-none">
            </div>

            <div class="flex flex-col">
                <label class="text-xs font-semibold text-slate-500 mb-1">Nombre de líder:</label>
                <input type="text" id="al-lider" required placeholder="Ej: Carlos Gómez" class="p-3 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:border-pink-500 focus:outline-none">
                <span class="text-[11px] text-slate-400 mt-1 italic">Si no tenés líder escribí <b>Sin líder</b>.</span>
            </div>

            <div class="flex flex-col">
                <label class="text-xs font-semibold text-pink-600 mb-1">Número de Celular (Obligatorio):</label>
                <input type="tel" id="al-celular" required placeholder="Ej: 1122334455" class="p-3 bg-pink-50/50 border border-pink-200 rounded-lg text-sm focus:border-pink-500 focus:outline-none">
            </div>

            <button type="button" id="btn-alumno-registrar" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 rounded-lg text-sm uppercase tracking-wide transition-all shadow-sm">
                Registrarme y Crear mi QR
            </button>
        </form>

        <div id="al-qr-box" class="hidden mt-6 p-5 border-2 border-dashed border-pink-300 rounded-xl bg-pink-50/30 flex-col items-center">
            <div id="al-qrcode" class="mx-auto p-3 bg-white rounded-xl shadow-md mb-3"></div>
            <span id="al-qr-label" class="text-xs font-bold text-slate-700 mb-4 bg-white px-2 py-1 rounded border"></span>
            <button type="button" id="btn-al-descargar" class="bg-slate-800 text-white text-xs font-bold py-2 px-4 rounded-lg">📥 Guardar en el Celular</button>
        </div>
    </div>

    <script>
        let alumnos = [];

        function cargarDatosIniciales() {
            const guardados = localStorage.getItem('alumnos_sistema_asistencia_v5');
            if (guardados) {
                try { alumnos = JSON.parse(guardados); } catch(e) {}
            }
        }
        cargarDatosIniciales();

        function guardarEnStorage() {
            localStorage.setItem('alumnos_sistema_asistencia_v5', JSON.stringify(alumnos));
        }

        function mostrarViñeta(mensaje, tipo = 'success') {
            const vineta = document.createElement('div');
            let color = tipo === 'error' ? 'bg-red-500' : (tipo === 'warning' ? 'bg-amber-500' : 'bg-emerald-500');
            vineta.className = `p-4 rounded-xl text-white font-bold shadow-lg min-w-[260px] ${color} flex items-center justify-between`;
            vineta.innerHTML = `<span>${mensaje}</span><strong class="ml-3 cursor-pointer opacity-70" onclick="this.parentElement.remove()">×</strong>`;
            document.getElementById('notification-container').appendChild(vineta);
            setTimeout(() => vineta.remove(), 4000);
        }

        document.getElementById('btn-alumno-registrar').addEventListener('click', async () => {
            const escuela = document.getElementById('al-escuela').value;
            const nombreCompleto = document.getElementById('al-nombre').value.trim();
            const edad = document.getElementById('al-edad').value.trim();
            const lider = document.getElementById('al-lider').value.trim();
            const celular = document.getElementById('al-celular').value.trim();

            const regexLetras = /^[A-Za-záéíóúÁÉÍÓÚñÑ\s]+$/;
            if (!nombreCompleto || !regexLetras.test(nombreCompleto)) {
                return mostrarViñeta("El nombre y apellido solo debe contener letras.", "error");
            }
            if (!edad || isNaN(edad) || Number(edad) <= 0) {
                return mostrarViñeta("Por favor, ingresá una edad válida.", "error");
            }
            if (!lider) {
                return mostrarViñeta("Por favor, ingresá el nombre de tu líder o escribí 'sin líder'.", "error");
            }
            if (!celular || !/^[0-9]+$/.test(celular)) {
                return mostrarViñeta("Ingresá un número de celular válido (solo números).", "error");
            }

            document.getElementById('btn-alumno-registrar').innerText = "Procesando...";
            document.getElementById('btn-alumno-registrar').disabled = true;

            try {
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                document.getElementById('form-alumno').classList.add('hidden');
                document.getElementById('al-qr-box').classList.remove('hidden'); 
                document.getElementById('al-qr-box').classList.add('flex');
                
                const idUnico = 'ID_' + Date.now().toString().slice(-6);
                document.getElementById('al-qrcode').innerHTML = ""; 
                new QRCode(document.getElementById('al-qrcode'), { text: idUnico, width: 150, height: 150, colorDark: "#1a365d" });
                document.getElementById('al-qr-label').innerText = `${nombreCompleto} (${escuela})`;

                alumnos.unshift({ id: idUnico, escuela, nombreCompleto, edad, lider, celular, faltas: 0, condicionManual: null, estado: "Ausente" });
                guardarEnStorage();
            } catch(e) { 
                mostrarViñeta("Registrado en el dispositivo.", "warning"); 
            }
        });

        document.getElementById('btn-al-descargar').addEventListener('click', () => {
            const qrCanvas = document.getElementById('al-qrcode').querySelector('canvas');
            if (qrCanvas) {
                const a = document.createElement('a'); a.download = `Credencial_${document.getElementById('al-qr-label').innerText}.png`; a.href = qrCanvas.toDataURL('image/png', 1.0); a.click();
            }
        });
    </script>
</body>
</html>
