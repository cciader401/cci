<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Unificado - Control de Asistencias</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="text-slate-800 font-sans min-h-screen flex flex-col items-center antialiased pb-10" style="background-color: #fafbfd;">

    <div id="notification-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3.5"></div>

    <div class="w-full max-w-5xl py-12 px-4 rounded-b-2xl shadow-lg border-b-4 border-pink-600 text-center relative overflow-hidden mb-6 bg-slate-900 text-white">
        <h1 class="m-0 text-3xl md:text-4xl font-extrabold uppercase tracking-wider">Control de Asistencias</h1>
        <p class="m-0 mt-2 text-slate-300 text-sm md:text-base font-medium">Sistema de Registro y Validación</p>
    </div>

    <!-- VISTA INSCRIPCIÓN ALUMNO -->
    <div id="vista-alumno" class="hidden w-[95%] max-w-md bg-white rounded-2xl p-6 shadow-md border border-slate-100 flex flex-col text-center">
        <h2 class="text-2xl font-bold text-slate-800 mb-2">Inscripción a Escuela</h2>
        <p class="text-xs text-slate-400 mb-6">Ingresá tus datos para registrarte y generar tu credencial.</p>
        
        <form id="form-alumno" class="space-y-4 text-left" onsubmit="return false;">
            <!-- ESCUELA PRIMERO -->
            <div class="flex flex-col">
                <label class="text-xs font-semibold text-slate-500 mb-1">Seleccionar Escuela:</label>
                <select id="al-escuela" class="p-3 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:border-pink-500 focus:outline-none">
                    <option value="ABC">Escuela ABC </option>
                    <option value="Nivel 1">Nivel 1 </option>
                    <option value="Nivel 2">Nivel 2 </option>
                    <option value="Nivel 3">Nivel 3 </option>
                </select>
            </div>
            <div class="flex flex-col">
                <label class="text-xs font-semibold text-slate-500 mb-1">Nombre y Apellido:</label>
                <input type="text" id="al-nombre" required placeholder="Ej: Juan Pérez" class="p-3 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:border-pink-500 focus:outline-none">
            </div>
            <div class="flex flex-col">
                <label class="text-xs font-semibold text-slate-500 mb-1">DNI (Solo números):</label>
                <input type="text" id="al-dni" required placeholder="Ej: 46123456" class="p-3 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:border-pink-500 focus:outline-none">
            </div>
            <div class="flex flex-col">
                <label class="text-xs font-semibold text-slate-500 mb-1">Nombre de líder:</label>
                <input type="text" id="al-lider" value="NN" required class="p-3 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:border-pink-500 focus:outline-none">
            </div>
            <!-- CAMPO DINÁMICO DE CELULAR (Aparece solo si el líder es NN) -->
            <div id="box-celular" class="flex flex-col">
                <label class="text-xs font-semibold text-pink-600 mb-1">Número de Celular (Para asignarte líder):</label>
                <input type="tel" id="al-celular" placeholder="Ej: 1122334455" class="p-3 bg-pink-50/50 border border-pink-200 rounded-lg text-sm focus:border-pink-500 focus:outline-none">
            </div>

            <button type="button" id="btn-alumno-registrar" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 rounded-lg text-sm uppercase tracking-wide transition-all shadow-sm">
                Registrarme y Crear mi QR
            </button>
        </form>

        <div id="al-qr-box" class="hidden mt-6 p-5 border-2 border-dashed border-pink-300 rounded-xl bg-pink-50/30 flex-col items-center">
            <div id="al-qrcode" class="mx-auto p-3 bg-white rounded-xl shadow-md mb-3"></div>
            <span id="al-qr-label" class="text-xs font-bold text-slate-700 mb-4 bg-white px-2 py-1 rounded border"></span>
            <button type="button" id="btn-al-descargar" class="bg-slate-800 text-white text-xs font-bold py-2 px-4 rounded-lg">📥 Guardar en el Celular</button>
        </div>
    </div>

    <!-- VISTA ADMINISTRADOR -->
    <div id="vista-admin" class="hidden w-[95%] max-w-5xl flex-col items-center">
        <div id="status" class="w-full bg-white border-l-4 border-pink-600 rounded-r-xl shadow-sm p-4 text-center font-bold text-sm text-slate-700 mb-6 uppercase">
            CONECTANDO CON LA NUBE...
        </div>

        <div class="w-full grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex flex-col md:col-span-1">
                <h2 class="text-lg font-bold text-slate-800 border-b pb-2 mb-2">📸 Escáner de Entrada</h2>
                <div id="reader" class="w-full max-w-[260px] mx-auto rounded-xl overflow-hidden shadow-inner !border-0"></div>
                <div id="cartel-gigante" class="mt-4 p-4 rounded-xl text-center font-extrabold uppercase transition-all hidden border duration-300">
                    <span id="cartel-texto-grande" class="block text-base tracking-wide"></span>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 overflow-hidden md:col-span-2 flex flex-col">
                <div id="area-impresion-pdf" class="w-full bg-white">
                    <h2 class="text-lg font-bold text-slate-800 mb-1">Planilla en Tiempo Real</h2>
                    
                    <div class="my-3 no-export">
                        <input type="text" id="buscador-alumnos" placeholder="🔍 Buscar por Nombre, DNI o Líder..." class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:border-pink-500 focus:outline-none shadow-inner">
                    </div>

                    <div class="flex flex-wrap gap-2 my-4 download-actions">
                        <button class="bg-[#1f7244] text-white font-bold py-2 px-3 rounded-lg text-xs" id="btn-excel">🟢 Todo (Excel)</button>
                        <button class="bg-[#c0392b] text-white font-bold py-2 px-3 rounded-lg text-xs" id="btn-pdf">🔴 Reporte PDF</button>
                    </div>

                    <div class="overflow-x-auto rounded-xl border border-slate-100">
                        <table class="w-full text-left border-collapse text-xs">
                            <thead>
                                <tr class="bg-slate-50 border-b border-slate-200 font-bold uppercase text-slate-600">
                                    <th class="p-3">Escuela</th>
                                    <th class="p-3">Alumno</th>
                                    <th class="p-3">DNI</th>
                                    <th class="p-3">Líder / Cel</th>
                                    <th class="p-3 text-center">Faltas</th>
                                    <th class="p-3">Condición</th>
                                    <th class="p-3 no-export">Acción</th>
                                </tr>
                            </thead>
                            <tbody id="cuerpo-tabla" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwXs6J9bBK1xRXSYhM5cMEKQzCcX9KltQJhPqwb8-PSxQ3pefXOllAy7sey2xzTSM4YXQ/exec";

        let alumnos = [];
        const urlParams = new URLSearchParams(window.location.search);
        const esAdmin = urlParams.get('admin') === 'true';

        // Mostrar / Ocultar campo celular dinámicamente si escriben NN
        const inputLider = document.getElementById('al-lider');
        const boxCelular = document.getElementById('box-celular');
        inputLider.addEventListener('input', () => {
            const valor = inputLider.value.trim().toUpperCase();
            if (valor === 'NN' || valor === '') {
                boxCelular.style.display = 'flex';
            } else {
                boxCelular.style.display = 'none';
                document.getElementById('al-celular').value = '';
            }
        });

        function mostrarViñeta(mensaje, tipo = 'success') {
            const vineta = document.createElement('div');
            let color = tipo === 'error' ? 'bg-red-500' : (tipo === 'warning' ? 'bg-amber-500' : 'bg-emerald-500');
            vineta.className = `p-4 rounded-xl text-white font-bold shadow-lg min-w-[260px] ${color} flex items-center justify-between`;
            vineta.innerHTML = `<span>${mensaje}</span><strong class="ml-3 cursor-pointer opacity-70" onclick="this.parentElement.remove()">×</strong>`;
            document.getElementById('notification-container').appendChild(vineta);
            setTimeout(() => vineta.remove(), 4000);
        }

        if (esAdmin) {
            document.getElementById('vista-admin').classList.remove('hidden');
            document.getElementById('vista-admin').classList.add('flex');
            cargarDatosDesdeSheets();
            inicializarEscaner();
        } else {
            document.getElementById('vista-alumno').classList.remove('hidden');
            document.getElementById('vista-alumno').classList.add('flex');
        }

        document.getElementById('btn-alumno-registrar').addEventListener('click', async () => {
            const escuela = document.getElementById('al-escuela').value;
            const nombreCompleto = document.getElementById('al-nombre').value.trim();
            const dni = document.getElementById('al-dni').value.trim();
            let lider = document.getElementById('al-lider').value.trim();
            if(!lider) lider = "NN";
            let celular = document.getElementById('al-celular').value.trim();

            if(!/^[0-9]{7,8}$/.test(dni)) return mostrarViñeta("DNI Inválido (7 u 8 dígitos)", "error");
            if(!nombreCompleto) return mostrarViñeta("Ingresá tu nombre y apellido", "error");
            if((lider.toUpperCase() === 'NN') && !celular) return mostrarViñeta("Ingresá tu celular para asignarte líder", "error");

            document.getElementById('btn-alumno-registrar').innerText = "Procesando...";
            document.getElementById('btn-alumno-registrar').disabled = true;
            try {
                const res = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "registrar", escuela, nombreCompleto, dni, lider, celular }) });
                const r = await res.json();
                if (r.status === "success") {
                    confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                    document.getElementById('form-alumno').classList.add('hidden');
                    document.getElementById('al-qr-box').classList.remove('hidden'); document.getElementById('al-qr-box').classList.add('flex');
                    document.getElementById('al-qrcode').innerHTML = ""; new QRCode(document.getElementById('al-qrcode'), { text: dni, width: 150, height: 150, colorDark: "#1a365d" });
                    document.getElementById('al-qr-label').innerText = `${nombreCompleto} (${escuela})`;
                } else { mostrarViñeta(r.message, "error"); }
            } catch(e) { mostrarViñeta("Error de conexión a la nube", "error"); }
            document.getElementById('btn-alumno-registrar').innerText = "Registrarme y Crear mi QR"; document.getElementById('btn-alumno-registrar').disabled = false;
        });

        document.getElementById('btn-al-descargar').addEventListener('click', () => {
            const qrCanvas = document.getElementById('al-qrcode').querySelector('canvas');
            if (qrCanvas) {
                const a = document.createElement('a'); a.download = `Credencial_${document.getElementById('al-qr-label').innerText}.png`; a.href = qrCanvas.toDataURL('image/png', 1.0); a.click();
            }
        });

        async function cargarDatosDesdeSheets() {
            try {
                const r = await fetch(SCRIPT_URL); alumnos = await r.json();
                actualizarTabla();
                document.getElementById('status').innerText = "SISTEMA ONLINE: DATOS SINCRONIZADOS.";
            } catch (e) { document.getElementById('status').innerText = "🔴 ERROR DE CONEXIÓN AL SERVIDOR."; }
        }

        function actualizarTabla() {
            const tbody = document.getElementById('cuerpo-tabla');
            tbody.innerHTML = "";
            const filtro = document.getElementById('buscador-alumnos').value.toLowerCase().trim();

            alumnos.forEach((al, idx) => {
                const coincide = al.nombreCompleto.toLowerCase().includes(filtro) || al.dni.toString().includes(filtro) || al.lider.toLowerCase().includes(filtro);
                if (filtro && !coincide) return;

                const tr = document.createElement('tr');
                let colorFila = "hover:bg-slate-50";
                let condicionTexto = "Aprobado";
                if (al.faltas >= 4) {
                    condicionTexto = "Desaprobado";
                    colorFila = "bg-red-50 hover:bg-red-100 border-l-4 border-red-500 text-red-950";
                } else if (al.faltas === 3) {
                    colorFila = "bg-amber-50 hover:bg-amber-100 border-l-4 border-amber-500";
                }

                tr.className = `border-b border-slate-100 ${colorFila}`;
                tr.innerHTML = `
                    <td class="p-3 font-medium">${al.escuela}</td>
                    <td class="p-3 font-semibold">${al.nombreCompleto.toUpperCase()}</td>
                    <td class="p-3 text-slate-500 font-mono">${al.dni}</td>
                    <td class="p-3">${al.lider} ${al.celular ? '<br><span class="text-[10px] text-pink-600 font-bold">Cel: ' + al.celular + '</span>' : ''}</td>
                    <td class="p-3 text-center font-extrabold text-sm">${al.faltas}</td>
                    <td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase ${condicionTexto==='Aprobado'?'bg-emerald-100 text-emerald-800':'bg-red-600 text-white'}">${condicionTexto}</span></td>
                    <td class="p-3 no-export">
                        <select onchange="modificarDesdeAdmin(${idx}, this.value)" class="p-1 border rounded text-xs bg-white">
                            <option value="Presente" ${al.estado==='Presente'?'selected':''}>Presente</option>
                            <option value="Ausente" ${al.estado==='Ausente'?'selected':''}>Ausente (+1 Falta)</option>
                        </select>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('buscador-alumnos').addEventListener('input', actualizarTabla);

        async function modificarDesdeAdmin(idx, nuevoEstado) {
            const al = alumnos[idx];
            if (nuevoEstado === 'Ausente' && al.estado !== 'Ausente') {
                al.faltas += 1;
            }
            al.estado = nuevoEstado;

            try {
                await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "actualizar", dni: al.dni, faltas: al.faltas, estado: nuevoEstado }) });
                mostrarViñeta("Sincronizado con éxito", "success");
            } catch(e) { mostrarViñeta("Error al guardar en la nube", "error"); }
            cargarDatosDesdeSheets();
        }

        function inicializarEscaner() {
            const scan = new Html5QrcodeScanner("reader", { fps: 12, qrbox: 200 });
            scan.render(async (dniLeido) => {
                let al = alumnos.find(a => a.dni === dniLeido.trim());
                if (al) {
                    if (al.faltas >= 4) {
                        mostrarViñeta("Atención: Alumno desaprobado por exceso de faltas.", "error"); return; 
                    }
                    mostrarViñeta(`Presente registrado: ${al.nombreCompleto}`, "success");
                    al.estado = "Presente";
                    await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "actualizar", dni: al.dni, faltas: al.faltas, estado: "Presente" }) });
                    cargarDatosDesdeSheets();
                } else {
                    mostrarViñeta("DNI no registrado.", "error");
                }
            });
        }

        document.getElementById('btn-excel').addEventListener('click', () => {
            const s = XLSX.utils.json_to_sheet(alumnos); const b = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(b, s, "Asistencias"); XLSX.writeFile(b, "Reporte_Asistencias.xlsx");
        });

        document.getElementById('btn-pdf').addEventListener('click', () => {
            const d = document.querySelectorAll('.no-export, .download-actions'); d.forEach(el => el.style.visibility = 'hidden');
            html2pdf().from(document.getElementById('area-impresion-pdf')).save().then(() => { d.forEach(el => el.style.visibility = 'visible'); });
        });
    </script>
</body>
</html>
